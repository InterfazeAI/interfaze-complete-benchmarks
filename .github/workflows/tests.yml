name: tests

# The free, fast gate on every push/PR: the offline bench_core suite + target
# validation (test_targets.py loads/validates every bench_core/targets.yaml entry,
# so adding a model is checked here). No secrets, no API calls.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --group dev
      - name: Lint (new code)
        run: uv run ruff check bench_core tests
      - name: Tests (offline)
        run: uv run pytest -q
