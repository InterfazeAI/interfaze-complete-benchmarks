name: grok-4.3
provider: openrouter
model_id: x-ai/grok-4.3
capabilities:
  # Grok's OpenRouter endpoint rejects reasoning.enabled=false ("Reasoning is
  # mandatory"), so use the effort toggle with "minimal" as the floor.
  reasoning:
    extra: { toggle: effort }
    off_value: minimal
    on_value: high
    true_off: false
